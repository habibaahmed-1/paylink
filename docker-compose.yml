services:
  db:
    image: postgres:16-alpine
    container_name: paylink-db
    environment:
      POSTGRES_DB: paylink
      POSTGRES_USER: paylink
      POSTGRES_PASSWORD: paylink
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paylink"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: paylink-app
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/paylink
      SPRING_DATASOURCE_USERNAME: paylink
      SPRING_DATASOURCE_PASSWORD: paylink
    depends_on:
      db:
        condition: service_healthy